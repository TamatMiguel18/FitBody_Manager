<!DOCTYPE html>
<html xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Crear Cuenta - FitBody</title>
    <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
</h:head>
<h:body>
    <div class="h-screen w-screen flex align-items-center justify-content-center">
        <div class="surface-card p-4 shadow-2 border-round-xl w-full" style="max-width: 400px">
            <div class="text-center mb-5">
                <h2 class="text-900 font-bold mb-2">Crear Cuenta</h2>
                <p class="text-600 font-medium">Regístrate para poder aprovechar nuestros servicios</p>
            </div>

            <h:form id="crear-cuenta-form">
                <p:growl id="messages" showDetail="true" life="4000"/>

                <div class="field mb-3">
                    <p:outputLabel for="username" value="ID:" styleClass="font-bold block mb-2"/>
                    <p:inputText id="username"
                                 value="#{registroFormController.registro.usuario.idUsuario}"
                                 required="true"
                                 requiredMessage="El nombre de usuario es obligatorio."
                                 styleClass="w-full"
                                 placeholder="Ingresa tu nombre de usuario"/>
                </div>

                <div class="field mb-3">
                    <p:outputLabel for="correo" value="Correo:" styleClass="font-bold block mb-2"/>
                    <p:inputText id="correo"
                                 value="#{registroFormController.registro.correo}"
                                 required="true"
                                 requiredMessage="El correo es obligatorio."
                                 styleClass="w-full"
                                 placeholder="Ingresa tu correo"/>
                </div>

                <div class="field mb-3">
                    <p:outputLabel for="contraseña" value="Contraseña:" styleClass="font-bold block mb-2"/>
                    <p:password id="contraseña"
                                value="#{registroFormController.registro.contrasena}"
                                required="true"
                                requiredMessage="La contraseña es obligatoria."
                                styleClass="w-full"
                                placeholder="Ingresa tu contraseña"
                                feedback="true"
                                match="confirmarContraseña"
                                validatorMessage="Las contraseñas no coinciden."/>
                </div>

                <div class="field mb-3">
                    <p:outputLabel for="confirmarContraseña" value="Confirmar Contraseña:" styleClass="font-bold block mb-2"/>
                    <p:password id="confirmarContraseña"
                                value="#{registroFormController.registro.contrasena}"
                                required="true"
                                requiredMessage="Por favor, confirma tu contraseña."
                                styleClass="w-full"
                                placeholder="Confirma tu contraseña"
                                feedback="false"/>
                </div>

                <p:commandButton value="Crear Cuenta"
                                 action="#{registroFormController.guardarRegistro}"
                                 styleClass="w-full mt-3 p-button-success"
                                 update="messages"
                                 process="@form"/>
            </h:form>
        </div>
    </div>
</h:body>
</html>
