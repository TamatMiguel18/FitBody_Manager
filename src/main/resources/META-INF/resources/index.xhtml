<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>FitBody</title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
    </h:head>

    <h:body styleClass="p-4 bg-gray-100">
        <div class="card p-5 text-center shadow-2 border-round-xl surface-card">
            <h1 class="text-4xl font-bold text-primary-500 mb-2">FitBody</h1>
            <h2 class="text-xl font-normal text-600 mb-5">Dev_Busters</h2>

            <div class="p-fluid">
                <p:commandButton value="Regístrate" onclick="window.location.href='registroUsuario.xhtml';"
                                 styleClass="p-button-rounded p-button-lg p-button-success mb-3"/>
            </div>

            <div class="grid mt-5">
                <div class="col-12 md:col-6 lg:col-3">
                    <div class="card p-4 text-center surface-card border-round-xl border-1 hover:shadow-2 transition-all transition-duration-300">
                        <p:commandButton value="Lista Usuarios" onclick="window.location.href='usuarios.xhtml';"
                                         styleClass="p-button-rounded p-button-lg p-button-info w-full"/>
                    </div>
                </div>
                <div class="col-12 md:col-6 lg:col-3">
                    <div class="card p-4 text-center surface-card border-round-xl border-1 hover:shadow-2 transition-all transition-duration-300">
                        <p:commandButton value="Rutinas" onclick="window.location.href='DetalleRutina.xhtml';"
                                         styleClass="p-button-rounded p-button-lg p-button-warning w-full"/>
                    </div>
                </div>
                <div class="col-12 md:col-6 lg:col-3">
                    <div class="card p-4 text-center surface-card border-round-xl border-1 hover:shadow-2 transition-all transition-duration-300">
                        <p:commandButton value="Ejercicios" onclick="window.location.href='Ejercicios.xhtml';"
                                         styleClass="p-button-rounded p-button-lg p-button-danger w-full"/>
                    </div>
                </div>
                <div class="col-12 md:col-6 lg:col-3">
                    <div class="card p-4 text-center surface-card border-round-xl border-1 hover:shadow-2 transition-all transition-duration-300">
                        <p:commandButton value="Lista de Registros" onclick="window.location.href='Registros.xhtml';"
                                         styleClass="p-button-rounded p-button-lg p-button-secondary w-full"/>
                    </div>
                </div>
            </div>
        </div>
    </h:body>
</h:html>
