<!DOCTYPE html>
<h:html xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Gestion de Registros</title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
    </h:head>
    <h:body>
        <div class="card">
            <h:form id="formulario-registros">
                <p:growl id="mensaje-emergente" showDetails="true"/>


                <div class="card">
                    <p:dataTable value="#{registroFormController.listaRegistros}" var="registro"
                                 id="tabla-registros" widgetVar="registroTabla">

                        <f:facet name="header">
                            <div class="flex justify-content-center
                                        flex-wrap card-container yellow-container">
                                <div class="flex align-items-center justify-content-center
                                            w-20rem h4rem bg-yellom-500 font-bold m-2
                                            text-gray-900 border-round">
                                    <h3>Registro de Usuarios</h3>
                                </div>
                            </div>
                        </f:facet>

                        <p:column headerText="ID">
                            <h:outputText value="#{registro.idRegistro}"/>
                        </p:column>
                        <p:column headerText="USUARIO">
                            <h:outputText value="#{registro.usuario.nombre}"/>
                        </p:column>
                        <p:column headerText="CORREO">
                            <h:outputText value="#{registro.correo}"/>
                        </p:column>

                        <p:column>
                            <p:commandButton value="Editar" icon="pi pi-pencil"
                                             update=":formulario-modal:ventana-registro"
                                             process="@this"
                                             oncomplete="PF('ventanaModalRegistros').show()"
                                             class="ui-button-primary"
                                             style="margin-right:.5rem">
                                <f:setPropertyActionListener
                                        value="#{registro}"
                                        target="#{registroFormController.registro}"/>
                            </p:commandButton>
                            <p:commandButton value="Eliminar" icon="pi pi-trash"
                                             class="ui-button-danger"
                                             process="@this"
                                             oncomplete="PF('ventanaEliminarRegistro').show()">
                                <f:setPropertyActionListener
                                        value="#{registro}"
                                        target="#{registroFormController.registro}"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:form>

            <h:form id="formulario-modal">
                <p:dialog header="Detalle de Registro" showEffect="fade" modal="true" widgetVar="ventanaModalRegistros" responsive="true">
                    <p:outputPanel id="ventana-registro" class="ui-fluid">
                        <div class="field">
                            <p:outputLabel for="correo">Correo</p:outputLabel>
                            <p:inputText id="correo"
                                         value="#{registroFormController.registro.correo}"
                                         required="true"/>
                        </div>
                        <div class="field">
                            <p:outputLabel for="contrasena">Contraseña</p:outputLabel>
                            <p:inputText id="contrasena"
                                         value="#{registroFormController.registro.contrasena}"
                                         required="true"/>
                        </div>
                    </p:outputPanel>
                    <f:facet name="footer">
                        <p:commandButton value="Guardar" icon="pi pi-check"
                                         process="ventana-registro @this"
                                         actionListener="#{registroFormController.guardarRegistro}"
                                         update=":formulario-registros:tabla-registros :formulario-modal:ventana-registro"
                                         oncomplete="PF('ventanaModalRegistros').hide()"/>
                        <p:commandButton value="Cancelar" icon="pi pi-times"
                                         oncomplete="PF('ventanaModalRegistros').hide()"
                                         class="ui-button-secondary" type="button"/>
                    </f:facet>
                </p:dialog>
                <p:confirmDialog widgetVar="ventanaEliminarRegistro"
                                 showEffect="fade" width="300"
                                 message="¿Estas seguro de eliminar este registro?"
                                 header="Confirmar" severity="warn">
                    <p:commandButton value="Si" icon="pi pi-check"
                                     process="@this"
                                     actionListener="#{registroFormController.eliminarRegistro}"
                                     oncomplete="PF('ventanaEliminarRegistro').hide()"/>
                    <p:commandButton value="No" icon="pi pi-times"
                                     onclick="PF('ventanaEliminarRegistro').hide()"
                                     styleClass="ui-button-secondary" type="button"/>
                </p:confirmDialog>
            </h:form>
        </div>
    </h:body>
</h:html>
